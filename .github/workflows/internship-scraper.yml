name: Spring 2026 Internship Scraper

on:
  schedule:
    - cron: '0 9 * * *' # Runs at 9:00 AM UTC daily
  workflow_dispatch:     # Allows manual triggering
  push:
    paths-ignore:
      - 'README.md'      # Prevents workflow from running when README is updated by the script

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 PyGithub

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python internship_scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update internship listings - $(date +'%Y-%m-%d')" && git push)
